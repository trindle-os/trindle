name: checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-24.04
    # The checks run on Debian 13, the system Trindle is built on and for.
    container: debian:13
    steps:
      - name: Build tools and libraries
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git cargo rustc rust-clippy pkg-config \
            libpam0g-dev libxkbcommon-dev libpixman-1-dev libseat-dev libinput-dev libudev-dev libgbm-dev \
            libdrm-dev libdisplay-info-dev
      # actions/checkout v4.2.2, pinned to its commit.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build
        run: cargo build --release --locked
      - name: Test
        run: cargo test --release --locked
      - name: Clippy
        run: cargo clippy --release --locked -- -D warnings
