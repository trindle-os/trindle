# The screen reader's hand-over lock between the login screen and the session.
d /run/trindle 0755 root root -
d /run/trindle/greeter 0755 _greetd _greetd -
# Made by the login screen's reader, opened by the session's: the folder is only _greetd's to write in.
f /run/trindle/greeter/screen-reader-handover.lock 0666 _greetd _greetd -
