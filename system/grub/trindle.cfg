# Drop-in read after /etc/default/grub.
GRUB_DISTRIBUTOR="Trindle"
GRUB_THEME=/boot/grub/themes/trindle/theme.txt
GRUB_GFXMODE=auto
GRUB_GFXPAYLOAD_LINUX=keep
GRUB_TIMEOUT_STYLE=hidden
GRUB_TIMEOUT=1
for trindle_efi in /boot/efi/EFI/*; do
    case "$(basename "$trindle_efi" | tr 'A-Z' 'a-z')" in
        debian|trindle|boot|tools) ;;
        *) GRUB_TIMEOUT_STYLE=menu; GRUB_TIMEOUT=5 ;;
    esac
done
unset trindle_efi
GRUB_DISABLE_OS_PROBER=false
GRUB_CMDLINE_LINUX_DEFAULT="quiet loglevel=3 vt.global_cursor_default=0 rd.systemd.show_status=false"
trindle_sub=$(awk '$1 !~ /^#/ && $2 == "/" { n = split($4, o, ","); for (i = 1; i <= n; i++) if (o[i] ~ /^subvol=/) print substr(o[i], 8) }' /etc/fstab 2>/dev/null)
[ -n "$trindle_sub" ] && GRUB_CMDLINE_LINUX="$GRUB_CMDLINE_LINUX rootflags=subvol=${trindle_sub#/}"
unset trindle_sub
